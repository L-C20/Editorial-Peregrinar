<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Iniciar sesión | Editorial Peregrinar</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="login.css"
  >

</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-brand">

        <img
          src="assets/FondoEditorial.png"
          alt="Editorial Peregrinar"
        >

        <div class="login-brand-text">

          <strong>
            Editorial
          </strong>

          <span>
            Peregrinar
          </span>

        </div>

      </div>


      <div class="login-header">

        <p class="login-eyebrow">
          Administración
        </p>

        <h1>
          Bienvenido
        </h1>

        <p>
          Ingresá para administrar tu tienda.
        </p>

      </div>


      <form
        id="loginForm"
        class="login-form"
      >

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@email.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Contraseña
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >

        </div>


        <p
          id="loginError"
          class="login-error"
        ></p>


        <button
          type="submit"
          id="loginButton"
          class="login-button"
        >
          Iniciar sesión
        </button>

      </form>


      <a
        href="index.html"
        class="back-store"
      >
        ← Volver a la tienda
      </a>

    </section>

  </main>


  <script src="login.js"></script>

</body>

</html>
