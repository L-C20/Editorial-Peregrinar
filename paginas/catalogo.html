<html lang="es">
  <head>
    <meta charset="UTF-8" />

  href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
/>

    <link rel="stylesheet" href="../styles.css?v=20260718-2" />
    <link rel="icon" type="image/png" href="../assets/Fondo-EP.png" />
  </head>

  <body data-page="catalogo">

    <!-- HEADER -->
    <header class="site-header">
      <nav class="navbar" aria-label="Navegacion principal">
    
        <a class="brand" href="../index.html">
          <img src="../assets/FondoEditorial.png" alt="Logo Editorial Peregrinar" />
          <span>Editorial Peregrinar</span>
        </a>

        <button class="menu-toggle" type="button" aria-label="Abrir menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="nav-links" id="nav-links">
          <a href="../index.html">Inicio</a>
          <a href="catalogo.html">Catálogo</a>
          <a href="trabajos-personalizados.html">Personalizados</a>
          <a href="insumos.html">Insumos</a>
          <a href="promociones.html">Promociones</a>
          <a href="nosotros.html">Nosotros</a>
          <a href="contacto.html">Contacto</a>
        </div>

        <a href="carrito.html" class="carrito-nav">
          🛒 Mi Carrito
        </a>

      </nav>
    </header>

    <!-- MAIN -->
    <main>

      <section class="section page-hero">
        <p class="eyebrow">Catálogo</p>
        <h1>Productos organizados por categoría</h1>
        <p>Explora nuestros libros, agendas y papelería.</p>
      </section>

      <section class="section catalog">
        <div class="filter-tabs">
          <button class="filter-btn active" data-filter="todos">Todos</button>
          <button class="filter-btn" data-filter="infantiles">Infantiles</button>
          <button class="filter-btn" data-filter="adultos">Adultos</button>
          <button class="filter-btn" data-filter="papeleria">Papelería</button>
          <button class="filter-btn" data-filter="agendas">Agendas</button>
          <button class="filter-btn" data-filter="combos">Combos</button>
          <button class="filter-btn" data-filter="novedades">Novedades</button>
        </div>

        <div class="product-grid catalog-grid" id="catalogo-productos">
</div>

       
      </section>

      <div class="product-modal" id="product-modal" aria-hidden="true">
        <div class="product-modal-backdrop" data-close-modal></div>
        <article class="product-modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-product-title">
          <button class="modal-close" type="button" aria-label="Cerrar detalle" data-close-modal>×</button>

          <div class="modal-gallery" id="modal-gallery">
            <button class="modal-arrow modal-prev" type="button" aria-label="Imagen anterior">‹</button>
            <div class="modal-slides" id="modal-slides"></div>
            <button class="modal-arrow modal-next" type="button" aria-label="Imagen siguiente">›</button>
          </div>

          <div class="modal-product-info">
            <span class="tag" id="modal-product-tag"></span>
            <h2 id="modal-product-title"></h2>
            <strong id="modal-product-price"></strong>
            <p id="modal-product-detail"></p>

            <div class="cantidad modal-cantidad">
              <button class="btn-cantidad" type="button" id="modal-restar">-</button>
              <span class="contador" id="modal-contador">1</span>
              <button class="btn-cantidad" type="button" id="modal-sumar">+</button>
            </div>

            <button class="btn btn-primary" type="button" id="modal-agregar-carrito">
              Agregar al carrito
            </button>
          </div>
        </article>
      </div>

    </main>

    <!-- WHATSAPP -->

    <!-- FOOTER -->

    <script src="../script.js?v=20260718-2"></script>
